<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2E7D6B">
  <title>สื่อการเรียนรู้ — Kaka & Sheva</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Sarabun", "Leelawadee UI", sans-serif; background: #F4F7F6; color: #1F2A28; font-size: 18px; }
    header { background: #2E7D6B; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    header a { color: #fff; text-decoration: none; font-size: 26px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
    main { max-width: 820px; margin: 0 auto; padding: 16px; }
    h2.group { font-size: 19px; margin: 18px 4px 10px; color: #2E7D6B; }
    .lesson { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip { background: #E6F2EF; color: #2E7D6B; border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: bold; }
    .chip.exam { background: #FFF3D6; color: #8A5A00; }
    .lesson h3 { margin: 4px 0 4px; font-size: 22px; }
    .desc { color: #5B6B67; font-size: 15px; margin-bottom: 12px; }
    video { width: 100%; border-radius: 12px; background: #000; display: block; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .links a { background: #2E7D6B; color: #fff; text-decoration: none; border-radius: 10px; padding: 8px 14px; font-size: 15px; }
    .links a.alt { background: #E6F2EF; color: #2E7D6B; }
    .muted { color: #8A9894; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <a href="../" aria-label="กลับหน้าแรก">‹</a>
    <div>
      <h1>🎬 สื่อการเรียนรู้</h1>
      <p>คลิปสอน + ใบสอน 1 หน้า · แยกตามชั้นและการสอบ</p>
    </div>
  </header>
  <main id="list"></main>

  <script src="lessons-data.js"></script>
  <script>
    (function () {
      var NAMES = { Kaka: "กาก้า", Sheva: "เชว่า" };
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
      }
      // จัดกลุ่ม: ป. → สอบครั้งที่ (ใหม่ก่อน)
      var groups = {};
      LESSONS.forEach(function (l) {
        var k = l.grade + " · ปีการศึกษา " + l.year + " · สอบครั้งที่ " + l.exam;
        (groups[k] = groups[k] || { g: l.grade, y: l.year, e: l.exam, items: [] }).items.push(l);
      });
      var keys = Object.keys(groups).sort(function (a, b) {
        var A = groups[a], B = groups[b];
        return (B.y - A.y) || (B.e - A.e) || A.g.localeCompare(B.g, "th");
      });
      var html = keys.map(function (k) {
        var grp = groups[k];
        return '<h2 class="group">📚 ' + esc(grp.g) + " — สอบครั้งที่ " + grp.e + " (ปีการศึกษา " + grp.y + ")</h2>" +
          grp.items.map(function (l) {
            return '<section class="lesson" id="' + esc(l.id) + '">' +
              '<div class="meta"><span class="chip">' + esc(l.grade) + (NAMES[l.child] ? " · " + NAMES[l.child] : "") + '</span>' +
              '<span class="chip exam">สอบครั้งที่ ' + l.exam + '</span>' +
              '<span class="chip">' + esc(l.subject) + '</span>' +
              (l.chapter ? '<span class="chip">' + esc(l.chapter) + '</span>' : "") + "</div>" +
              "<h3>" + esc(l.emoji || "") + " " + esc(l.title) + "</h3>" +
              '<div class="desc">' + esc(l.desc) + "</div>" +
              (l.video ? '<video controls playsinline preload="metadata"' + (l.poster ? ' poster="' + esc(l.poster) + '"' : "") + ' src="' + esc(l.video) + '"></video>' : "") +
              '<div class="links">' +
              (l.sheet ? '<a href="' + esc(l.sheet) + '" target="_blank" rel="noopener">📄 ' + esc(l.sheetLabel || "ใบสอน") + "</a>" : "") +
              (l.video ? '<a class="alt" href="' + esc(l.video) + '" download>⬇️ โหลดคลิป (' + esc(l.minutes) + " นาที)</a>" : "") +
              "</div>" +
              '<div class="muted">เพิ่มเมื่อ ' + esc(l.added) + "</div></section>";
          }).join("");
      }).join("");
      document.getElementById("list").innerHTML = html || '<p class="muted">ยังไม่มีสื่อการเรียนรู้</p>';
    })();
  </script>
</body>
</html>
