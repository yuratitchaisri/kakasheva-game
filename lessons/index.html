<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2E7D6B">
  <title>สื่อการเรียนรู้ — Kaka & Sheva</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "Sarabun", "Leelawadee UI", sans-serif; background: #F4F7F6; color: #1F2A28; font-size: 18px; }
    header { background: #2E7D6B; color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    header a { color: #fff; text-decoration: none; font-size: 26px; }
    header h1 { margin: 0; font-size: 22px; }
    header p { margin: 2px 0 0; opacity: .85; font-size: 14px; }
    main { max-width: 820px; margin: 0 auto; padding: 14px 16px 40px; }
    /* แถบนำทาง */
    .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 14px; font-size: 15px; }
    .crumbs a { background: #fff; color: #2E7D6B; text-decoration: none; border-radius: 999px; padding: 5px 12px; font-weight: bold; border: 2px solid #CFE3DE; }
    .crumbs span.sep { color: #8A9894; }
    .crumbs span.cur { background: #2E7D6B; color: #fff; border-radius: 999px; padding: 5px 12px; font-weight: bold; }
    .step { font-size: 15px; color: #5B6B67; margin: 0 4px 10px; }
    /* ปุ่มเลือก */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    a.pick { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 18px; padding: 18px; color: inherit; text-decoration: none; border: 2px solid transparent; box-shadow: 0 3px 0 #DDE7E4; }
    a.pick:active, a.pick:hover { border-color: #2E7D6B; }
    a.pick .ic { font-size: 42px; line-height: 1; }
    a.pick .t { font-size: 21px; font-weight: bold; }
    a.pick .s { font-size: 14px; color: #5B6B67; margin-top: 2px; }
    a.pick > div { flex: 1; min-width: 0; }
    a.pick .go { color: #2E7D6B; font-size: 28px; }
    a.pick .n { display: inline-block; margin-top: 6px; background: #E6F2EF; color: #2E7D6B; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: bold; }
    /* บทเรียน */
    .lesson { background: #fff; border-radius: 16px; padding: 16px 18px; margin-bottom: 16px; }
    .lesson h3 { margin: 0 0 4px; font-size: 22px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
    .chip { background: #E6F2EF; color: #2E7D6B; border-radius: 999px; padding: 2px 11px; font-size: 13px; font-weight: bold; }
    .desc { color: #5B6B67; font-size: 15px; margin-bottom: 12px; }
    .part { margin-top: 14px; }
    .part .pt { font-size: 17px; margin-bottom: 6px; }
    .part .pt b { background: #FFE9B8; color: #7A5200; border-radius: 999px; padding: 2px 11px; margin-right: 4px; }
    .part .pt span { color: #8A9894; font-size: 13px; }
    video { width: 100%; border-radius: 12px; background: #000; display: block; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .links a { background: #2E7D6B; color: #fff; text-decoration: none; border-radius: 10px; padding: 8px 14px; font-size: 15px; }
    .links a.alt { background: #E6F2EF; color: #2E7D6B; }
    .muted { color: #8A9894; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <a href="../" aria-label="กลับหน้าแรก">‹</a>
    <div>
      <h1>🎬 สื่อการเรียนรู้</h1>
      <p>เลือก ชั้น → สอบครั้งที่ → วิชา</p>
    </div>
  </header>
  <main id="app"></main>

  <script src="lessons-data.js"></script>
  <script>
    (function () {
      var NAMES = { Kaka: "กาก้า", Sheva: "เชว่า" };
      var SUBJ_IC = { "คณิตศาสตร์": "➗", "ประวัติศาสตร์": "🏛️", "สังคมศึกษา": "🏘️", "ภาษาไทย": "📖", "วิทยาศาสตร์": "🔬", "English": "🔤", "Math-Inter": "🔢", "Science-Inter": "🧪" };
      var GRADE_IC = { "ป.1": "🧒", "ป.2": "👦" };
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
      }
      function uniq(arr) { var o = []; arr.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
      function sumMin(list) {
        var s = 0; list.forEach(function (l) { var m = /^(\d+):(\d+)$/.exec(l.minutes || ""); if (m) s += +m[1] * 60 + +m[2]; });
        return s ? Math.round(s / 60) + " นาที" : "";
      }
      // คลิปที่แบ่งเป็นตอน: l.parts = [{title, video, minutes}] (ตอนละ 3–5 นาที เด็กดูจบทีละตอน) · ไม่มี parts = คลิปเดียว l.video
      function vid(src, poster) {
        return '<video controls playsinline preload="none"' + (poster ? ' poster="' + esc(poster) + '"' : "") + ' src="' + esc(src) + '"></video>';
      }
      function videos(l) {
        if (!l.parts) return l.video ? vid(l.video, l.poster) : "";
        return l.parts.map(function (p, k) {
          return '<div class="part"><div class="pt"><b>ตอนที่ ' + (k + 1) + "</b> " + esc(p.title) + (p.minutes ? ' <span>⏱ ' + esc(p.minutes) + " นาที</span>" : "") + "</div>" + vid(p.video, p.poster || l.poster) + "</div>";
        }).join("");
      }
      // state ใน URL hash: #g=ป.2&e=2569-3&s=คณิตศาสตร์  (ปุ่มย้อนกลับใช้ได้ · ส่งลิงก์ต่อได้)
      function readHash() {
        var st = {};
        location.hash.replace(/^#/, "").split("&").forEach(function (kv) {
          var p = kv.split("="); if (p[0]) st[p[0]] = decodeURIComponent(p[1] || "");
        });
        return st;
      }
      function link(st) {
        var parts = [];
        ["g", "e", "s"].forEach(function (k) { if (st[k]) parts.push(k + "=" + encodeURIComponent(st[k])); });
        return "#" + parts.join("&");
      }
      var examKey = function (l) { return l.year + "-" + l.exam; };
      var examLabel = function (k) { var p = k.split("-"); return "สอบครั้งที่ " + p[1]; };

      function render() {
        var st = readHash(), app = document.getElementById("app"), h = "";
        var L = LESSONS.slice();
        var grades = uniq(L.map(function (l) { return l.grade; })).sort();
        // ข้ามขั้นที่ไม่มีอยู่จริง (ลิงก์เก่า) กลับไปขั้นก่อนหน้า
        if (st.g && grades.indexOf(st.g) < 0) st = {};
        var inG = L.filter(function (l) { return l.grade === st.g; });
        var exams = uniq(inG.map(examKey)).sort().reverse();
        if (st.e && exams.indexOf(st.e) < 0) st = { g: st.g };
        var inE = inG.filter(function (l) { return examKey(l) === st.e; });
        var subjects = uniq(inE.map(function (l) { return l.subject; }));
        if (st.s && subjects.indexOf(st.s) < 0) st = { g: st.g, e: st.e };

        // แถบนำทาง
        var cr = ['<a href="#">🏠 ทั้งหมด</a>'];
        if (st.g) cr.push(st.e ? '<a href="' + link({ g: st.g }) + '">' + esc(st.g) + "</a>" : '<span class="cur">' + esc(st.g) + "</span>");
        if (st.e) cr.push(st.s ? '<a href="' + link({ g: st.g, e: st.e }) + '">' + esc(examLabel(st.e)) + "</a>" : '<span class="cur">' + esc(examLabel(st.e)) + "</span>");
        if (st.s) cr.push('<span class="cur">' + esc(st.s) + "</span>");
        h += '<nav class="crumbs">' + cr.join('<span class="sep">›</span>') + "</nav>";

        if (!st.g) {
          h += '<div class="step">① เลือกชั้น</div><div class="grid">' + grades.map(function (g) {
            var items = L.filter(function (l) { return l.grade === g; });
            var kids = uniq(items.map(function (l) { return NAMES[l.child] || ""; })).filter(Boolean).join(" · ");
            return '<a class="pick" href="' + link({ g: g }) + '"><span class="ic">' + (GRADE_IC[g] || "🎒") + '</span><div><div class="t">' + esc(g) + '</div><div class="s">' + esc(kids) + '</div><span class="n">' + items.length + ' คลิป</span></div><span class="go">›</span></a>';
          }).join("") + "</div>";
        } else if (!st.e) {
          h += '<div class="step">② เลือกการสอบ</div><div class="grid">' + exams.map(function (k) {
            var items = inG.filter(function (l) { return examKey(l) === k; });
            return '<a class="pick" href="' + link({ g: st.g, e: k }) + '"><span class="ic">📝</span><div><div class="t">' + esc(examLabel(k)) + '</div><div class="s">ปีการศึกษา ' + esc(k.split("-")[0]) + " · " + uniq(items.map(function (l) { return l.subject; })).length + ' วิชา</div><span class="n">' + items.length + ' คลิป</span></div><span class="go">›</span></a>';
          }).join("") + "</div>";
        } else if (!st.s) {
          h += '<div class="step">③ เลือกวิชา</div><div class="grid">' + subjects.map(function (s) {
            var items = inE.filter(function (l) { return l.subject === s; });
            return '<a class="pick" href="' + link({ g: st.g, e: st.e, s: s }) + '"><span class="ic">' + (SUBJ_IC[s] || "📚") + '</span><div><div class="t">' + esc(s) + '</div><div class="s">' + esc(sumMin(items)) + '</div><span class="n">' + items.length + ' คลิป</span></div><span class="go">›</span></a>';
          }).join("") + "</div>";
        } else {
          var items = inE.filter(function (l) { return l.subject === st.s; });
          h += '<div class="step">④ ' + esc(st.g) + " · " + esc(examLabel(st.e)) + " · " + esc(st.s) + " — " + items.length + " คลิป</div>";
          h += items.map(function (l, i) {
            return '<section class="lesson" id="' + esc(l.id) + '">' +
              '<div class="chips"><span class="chip">คลิปที่ ' + (i + 1) + "</span>" + (l.chapter ? '<span class="chip">' + esc(l.chapter) + "</span>" : "") +
              (l.minutes ? '<span class="chip">⏱ ' + esc(l.minutes) + " นาที</span>" : "") + (l.parts ? '<span class="chip">' + l.parts.length + " ตอน</span>" : "") + "</div>" +
              "<h3>" + esc(l.emoji || "") + " " + esc(l.title) + "</h3>" +
              '<div class="desc">' + esc(l.desc) + "</div>" +
              videos(l) +
              '<div class="links">' +
              (l.sheet ? '<a href="' + esc(l.sheet) + '" target="_blank" rel="noopener">📄 ' + esc(l.sheetLabel || "ใบสอน") + "</a>" : "") +
              (l.parts ? l.parts.map(function (p, k) { return '<a class="alt" href="' + esc(p.video) + '" download>⬇️ โหลดตอนที่ ' + (k + 1) + "</a>"; }).join("") :
                l.video ? '<a class="alt" href="' + esc(l.video) + '" download>⬇️ โหลดคลิป</a>' : "") +
              "</div>" + '<div class="muted">เพิ่มเมื่อ ' + esc(l.added) + "</div></section>";
          }).join("");
        }
        app.innerHTML = h;
        window.scrollTo(0, 0);
      }
      window.addEventListener("hashchange", render);
      render();
    })();
  </script>
</body>
</html>
