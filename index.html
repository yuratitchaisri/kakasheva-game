<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#9B5DE5">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">

<body>
  <div id="app"></div>
  <div id="confetti"></div>

  <!-- โหลดตามลำดับ: ตัวการ์ตูน → ข้อมูลคำถาม → ตัวเกม -->
  <script src="buddies.js"></script>
  <script src="data/quizzes.js"></script>
  <script src="app.js"></script>

  <!-- Service Worker: เล่นออฟไลน์ + เพิ่มลงหน้าจอโฮมได้ (ทำงานเฉพาะบนเว็บ https ไม่ใช่ file://) -->
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
